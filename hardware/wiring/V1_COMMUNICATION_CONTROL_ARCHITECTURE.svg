<text x="1057.5" y="1027.1399999999999" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#172B3A" text-anchor="middle">PWM brightness control</text>
<text x="40" y="1090" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#526675" text-anchor="start">Individual PWM outputs are not tied together. Positions in Table 8; PWM7 left light, PWM8 right light.</text>
